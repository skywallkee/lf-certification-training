domains:
  - key: application-design-build
    name: "Application Design and Build"
    weight: 20
    competencies:
      - key: define-build-modify-container-images
        statement: "Define, build and modify container images"
      - key: choose-right-workload-resource-deployment
        statement: "Choose and use the right workload resource (Deployment, DaemonSet, CronJob, etc.)"
      - key: multi-container-pod-design-patterns
        statement: "Understand multi-container Pod design patterns (e.g. sidecar, init and others)"
