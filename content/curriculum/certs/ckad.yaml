      - key: configmaps
        statement: "Understand ConfigMaps"
      - key: create-consume-secrets
        statement: "Create & consume Secrets"
      - key: serviceaccounts
        statement: "Understand ServiceAccounts"
      - key: application-security-securitycontexts
        statement: "Understand Application Security (SecurityContexts, Capabilities, etc.)"
  - key: services-networking
    name: "Services and Networking"
    weight: 20
    competencies:
