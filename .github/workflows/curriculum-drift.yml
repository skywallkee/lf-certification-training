name: Curriculum drift

# Monthly check of cncf/curriculum for revised or new exam curricula. Opens (or updates) one issue.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare with cncf/curriculum
        id: drift
        run: |
          set +e
          pnpm curriculum:verify-sources --drift --report "$RUNNER_TEMP/drift.md"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; elif [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Open or update the drift issue
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Curriculum drift: cncf/curriculum changed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/drift.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/drift.md"
          fi
