# LF Cert Trainer, the whole stack on one machine:
#
#   docker compose up --build        then open http://localhost:3000 (sample logins in the README)
#
# Services: Postgres, a local mail inbox (Mailpit), a one-shot setup job (migrations, content ingest, sample learners), the web app, and the
# lab controller, which starts each lab as k3s in Docker next to these containers (it needs the Docker socket).
# Settings come from .env when present (see .env.example); the defaults below are for local use only.
name: lfct

x-secrets: &secrets
  LAB_CONTROLLER_SECRET: ${LAB_CONTROLLER_SECRET:-local-controller-secret-change-me-0123456789}
  LAB_TOKEN_SECRET: ${LAB_TOKEN_SECRET:-local-terminal-token-secret-change-me-0123456789}

services:
  postgres:
    # Pinned: a new Postgres or OS release under a floating tag can change collations under existing data.
    image: postgres:17.12-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lfct
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # For psql and `pnpm dev` from the host. Change the left side if 5432 is taken.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lfct"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A local test inbox: the web app sends every email here over SMTP, and nothing reaches real addresses.
  # Open http://localhost:8025 to read verification emails.
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      # SMTP, for `pnpm dev` on the host (SMTP_URL=smtp://localhost:1025).
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Builds the lab workstation image (ttyd, kubectl, helm, Chainsaw) that the controller starts per lab.
  lab-tools:
    build:
      context: platform/lab-image
      secrets: [extra_ca]
    image: lfct-lab-tools:local
    command: ["true"]
    restart: "no"

  setup:
    build:
      context: .
      target: setup
      secrets: [extra_ca]
    image: lfct-setup:local
    init: true
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lfct
      # if-missing (default) keeps your progress; always resets the sample learners; never skips them.
      SEED: ${SEED:-if-missing}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lab-controller:
    build:
      context: .
      target: lab-controller
      secrets: [extra_ca]
    image: lfct-lab-controller:local
    init: true
    environment:
      <<: *secrets
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lfct
      LAB_PROVIDER: ${LAB_PROVIDER:-docker}
      LAB_REACH: network
      LAB_NETWORK: lfct-labs
      LAB_TOOLS_IMAGE: lfct-lab-tools:local
      LAB_K3S_IMAGE: ${LAB_K3S_IMAGE:-rancher/k3s:v1.34.13-k3s1}
      LAB_DOCS_HOSTS: ${LAB_DOCS_HOSTS:-kubernetes.io,helm.sh}
      LAB_IMAGE_CACHE: ${LAB_IMAGE_CACHE:-true}
      LAB_ALLOWED_ORIGINS: ${APP_URL:-http://localhost:3000}
    volumes:
      # Starts and removes lab containers on this machine's Docker.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks: [default, labs]
    ports:
      # The browser's terminal WebSocket connects here.
      - "127.0.0.1:${LAB_CONTROLLER_PORT:-3001}:3001"
    depends_on:
      setup:
        condition: service_completed_successfully
      lab-tools:
        condition: service_completed_successfully
    # Healthcheck: defined in the Dockerfile (GET /health).
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      secrets: [extra_ca]
    image: lfct-web:local
    init: true
    environment:
      <<: *secrets
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lfct
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-auth-secret-change-me-0123456789abcdef}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Email goes to the Mailpit inbox above. Set SMTP_URL in .env to send real mail instead.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-LF Cert Trainer <no-reply@lfct.localhost>}
      MAIL_INBOX_URL: ${MAIL_INBOX_URL:-http://localhost:${MAILPIT_PORT:-8025}}
      # A production build running on a laptop: the verify page also shows the link and the inbox.
      APP_ENV: local
      SHOW_DEV_EMAILS: "true"
      LAB_CONTROLLER_URL: http://lab-controller:3001
      LAB_TERMINAL_URL: ws://localhost:${LAB_CONTROLLER_PORT:-3001}
      # The docs pane: the controller serves these sites at <site>.localhost (resolves to this machine).
      LAB_DOCS_URL: http://{host}.localhost:${LAB_CONTROLLER_PORT:-3001}
      LAB_DOCS_HOSTS: ${LAB_DOCS_HOSTS:-kubernetes.io,helm.sh}
      LAB_PROVIDER_NAME: ${LAB_PROVIDER_NAME:-local-docker}
      LAB_MONTHLY_MINUTES: ${LAB_MONTHLY_MINUTES:-600}
      LAB_MAX_ACTIVE_SESSIONS: ${LAB_MAX_ACTIVE_SESSIONS:-3}
      MOCK_EXAMS_PER_MONTH: ${MOCK_EXAMS_PER_MONTH:-2}
      MOCK_PRACTICE_PER_MONTH: ${MOCK_PRACTICE_PER_MONTH:-2}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
      lab-controller:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Lab workstations join this network so the controller can reach their terminals; clusters stay private.
  labs:
    name: lfct-labs

volumes:
  pgdata:

secrets:
  # Optional: a CA bundle for builds behind a TLS-inspecting proxy. Point EXTRA_CA_FILE at it; the default is
  # an empty file that does nothing.
  extra_ca:
    file: ${EXTRA_CA_FILE:-./platform/lab-image/no-extra-ca.crt}
